version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags: |
      -w
      -s

archives:
  - format: binary
    name_template: '{{ .Binary }}'

checksum:
  name_template: '{{ .ProjectName }}_{{.Version}}_checksums.txt'
  algorithm: sha256

snapshot:
  name_template: '{{ .ProjectName }}_next'

release:
  github:
    owner: fitzplsr
    name: sigstore-kms-yckms

sboms:
  - artifacts: archive
    cmd: .tool/syft
    documents:
      - "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom"
    args:
      - "scan"
      - "$artifact"
      - "--output"
      - "json=$document"

signs:
  - cmd: .tool/cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--use-signing-config=false"
      - "--oidc-issuer=https://token.actions.githubusercontent.com"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
